services:
  - type: web
    name: tracestory-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    rootDir: frontend
    envVars:
      - key: REACT_APP_API_URL
        value: https://tracestory-backend.onrender.com/api

  - type: web
    name: tracestory-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tracestory-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
    healthCheckPath: /health

databases:
  - name: tracestory-db
    databaseName: tracestory
    user: tracestory_user
